# ─────────────────────────────────────────────────────────────────────
#  ASTRA — Docker Compose
#  Starts the API + Ganache blockchain node together
#
#  Usage:
#    docker compose up --build        # Start everything
#    docker compose up -d             # Start in background
#    docker compose logs -f astra     # Follow API logs
#    docker compose down              # Stop and remove containers
# ─────────────────────────────────────────────────────────────────────

services:

  # ── Ganache (local Ethereum blockchain) ───────────────────────────
  ganache:
    image: trufflesuite/ganache:latest
    container_name: astra-ganache
    ports:
      - "8545:8545"
    command: >
      --deterministic
      --accounts 10
      --host 0.0.0.0
      --port 8545
      --networkId 1337
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8545"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── ASTRA API ──────────────────────────────────────────────────────
  astra:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: astra-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - GANACHE_URL=http://ganache:8545
    volumes:
      - ./logs:/app/logs
    depends_on:
      ganache:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
    restart: unless-stopped

volumes:
  logs:
