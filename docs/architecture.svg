<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="'Times New Roman', Times, 'Liberation Serif', 'Nimbus Roman', serif">
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
  </marker>
  <style>
    .box   { fill:#f5f5f5; stroke:#1a1a1a; stroke-width:1.2; }
