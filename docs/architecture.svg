<svg xmlns="http://www.w3.org/2000/svg" width="900" viewBox="0 0 900 860" style="background:#0d1117;font-family:ui-sans-serif,system-ui,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#3fb950" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#a5b4fc" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#f0883e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- ═══ SECTION LABELS ═══════════════════════════════════════════ -->
  <text x="450" y="22" text-anchor="middle" font-size="10" fill="#484f58" font-weight="700" letter-spacing="1.5">INPUT SOURCES</text>
  <text x="450" y="152" text-anchor="middle" font-size="10" fill="#484f58" font-weight="700" letter-spacing="1.5">API GATEWAY</text>
  <text x="450" y="282" text-anchor="middle" font-size="10" fill="#484f58" font-weight="700" letter-spacing="1.5">ROUTERS</text>
  <text x="450" y="412" text-anchor="middle" font-size="10" fill="#484f58" font-weight="700" letter-spacing="1.5">INFERENCE ENGINE</text>
  <text x="450" y="552" text-anchor="middle" font-size="10" fill="#484f58" font-weight="700" letter-spacing="1.5">ML ARTIFACTS</text>
  <text x="450" y="692" text-anchor="middle" font-size="10" fill="#484f58" font-weight="700" letter-spacing="1.5">ENSEMBLE DECISION + BLOCKCHAIN</text>

  <!-- ─── Dividers ──────────────────────────────────────────────── -->
  <line x1="40" y1="134" x2="860" y2="134" stroke="#21262d" stroke-width="1"/>
  <line x1="40" y1="264" x2="860" y2="264" stroke="#21262d" stroke-width="1"/>
  <line x1="40" y1="394" x2="860" y2="394" stroke="#21262d" stroke-width="1"/>
  <line x1="40" y1="534" x2="860" y2="534" stroke="#21262d" stroke-width="1"/>
  <line x1="40" y1="674" x2="860" y2="674" stroke="#21262d" stroke-width="1"/>

  <!-- ═══ ROW 0 — INPUT SOURCES ════════════════════════════════════ -->
  <rect x="40"  y="32" width="160" height="52" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="120" y="54" text-anchor="middle" font-size="12" fill="#c9d1d9" font-weight="600">Single flow</text>
  <text x="120" y="72" text-anchor="middle" font-size="10" fill="#8b949e">POST /predict</text>

  <rect x="222" y="32" width="160" height="52" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="302" y="54" text-anchor="middle" font-size="12" fill="#c9d1d9" font-weight="600">Batch JSON</text>
  <text x="302" y="72" text-anchor="middle" font-size="10" fill="#8b949e">POST /predict/batch</text>

  <rect x="404" y="32" width="160" height="52" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="484" y="54" text-anchor="middle" font-size="12" fill="#c9d1d9" font-weight="600">CSV upload</text>
  <text x="484" y="72" text-anchor="middle" font-size="10" fill="#8b949e">POST /predict/csv</text>

  <rect x="586" y="32" width="160" height="52" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="666" y="54" text-anchor="middle" font-size="12" fill="#c9d1d9" font-weight="600">Web dashboard</text>
  <text x="666" y="72" text-anchor="middle" font-size="10" fill="#8b949e">astra_dashboard.html</text>

  <rect x="768" y="32" width="100" height="52" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="818" y="54" text-anchor="middle" font-size="12" fill="#c9d1d9" font-weight="600">Swagger</text>
  <text x="818" y="72" text-anchor="middle" font-size="10" fill="#8b949e">GET /docs</text>

  <!-- Arrows: inputs → gateway -->
  <line x1="120"  y1="84" x2="310" y2="162" stroke="#8b949e" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="302"  y1="84" x2="370" y2="162" stroke="#8b949e" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="484"  y1="84" x2="450" y2="162" stroke="#8b949e" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="666"  y1="84" x2="530" y2="162" stroke="#8b949e" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="818"  y1="84" x2="600" y2="162" stroke="#8b949e" stroke-width="1" marker-end="url(#arr)"/>

  <!-- ═══ ROW 1 — FASTAPI GATEWAY ══════════════════════════════════ -->
  <rect x="80" y="162" width="740" height="60" rx="10" fill="#1a1f6e" stroke="#3b41c5" stroke-width="1.3"/>
  <text x="450" y="185" text-anchor="middle" font-size="13" fill="#a5b4fc" font-weight="700">FastAPI application</text>
  <text x="450" y="205" text-anchor="middle" font-size="10" fill="#818cf8">CORS middleware · lifespan · request timing · global error handler · structured logging</text>

  <!-- Arrows: gateway → routers (fan out) -->
  <line x1="240" y1="222" x2="130" y2="292" stroke="#a5b4fc" stroke-width="1" marker-end="url(#arr-p)"/>
  <line x1="340" y1="222" x2="305" y2="292" stroke="#a5b4fc" stroke-width="1" marker-end="url(#arr-p)"/>
  <line x1="560" y1="222" x2="565" y2="292" stroke="#a5b4fc" stroke-width="1" marker-end="url(#arr-p)"/>
  <line x1="660" y1="222" x2="735" y2="292" stroke="#a5b4fc" stroke-width="1" marker-end="url(#arr-p)"/>

  <!-- ═══ ROW 2 — ROUTERS ═══════════════════════════════════════════ -->
  <rect x="40"  y="292" width="168" height="60" rx="8" fill="#0d2d1a" stroke="#238636" stroke-width="1.2"/>
  <text x="124" y="316" text-anchor="middle" font-size="12" fill="#3fb950" font-weight="600">Health</text>
  <text x="124" y="334" text-anchor="middle" font-size="10" fill="#56d364">GET /api/v1/health</text>
  <text x="124" y="348" text-anchor="middle" font-size="10" fill="#2ea043">models + blockchain status</text>

  <rect x="225" y="292" width="168" height="60" rx="8" fill="#0d2d1a" stroke="#238636" stroke-width="1.2"/>
  <text x="309" y="316" text-anchor="middle" font-size="12" fill="#3fb950" font-weight="600">Predict</text>
  <text x="309" y="334" text-anchor="middle" font-size="10" fill="#56d364">POST /predict</text>
  <text x="309" y="348" text-anchor="middle" font-size="10" fill="#2ea043">single network flow</text>

  <rect x="483" y="292" width="168" height="60" rx="8" fill="#0d2d1a" stroke="#238636" stroke-width="1.2"/>
  <text x="567" y="316" text-anchor="middle" font-size="12" fill="#3fb950" font-weight="600">Batch</text>
  <text x="567" y="334" text-anchor="middle" font-size="10" fill="#56d364">POST /batch · /csv</text>
  <text x="567" y="348" text-anchor="middle" font-size="10" fill="#2ea043">up to 5 000 flows</text>

  <rect x="668" y="292" width="192" height="60" rx="8" fill="#0d2d1a" stroke="#238636" stroke-width="1.2"/>
  <text x="764" y="316" text-anchor="middle" font-size="12" fill="#3fb950" font-weight="600">Blockchain router</text>
  <text x="764" y="334" text-anchor="middle" font-size="10" fill="#56d364">GET /blockchain/*</text>
  <text x="764" y="348" text-anchor="middle" font-size="10" fill="#2ea043">logs · status · record/:id</text>

  <!-- Arrows: predict + batch → model manager -->
  <line x1="309" y1="352" x2="365" y2="422" stroke="#8b949e" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="567" y1="352" x2="510" y2="422" stroke="#8b949e" stroke-width="1" marker-end="url(#arr)"/>

  <!-- ═══ ROW 3 — MODEL MANAGER ════════════════════════════════════ -->
  <rect x="150" y="422" width="560" height="70" rx="10" fill="#1a1000" stroke="#d29922" stroke-width="1.3"/>
  <text x="430" y="448" text-anchor="middle" font-size="13" fill="#f0c040" font-weight="700">Model manager  (singleton · loads once at startup)</text>
  <text x="430" y="467" text-anchor="middle" font-size="10" fill="#c9a02a">StandardScaler · label encoder · predict() + predict_proba() · 51 CICFlowMeter features</text>
  <text x="430" y="483" text-anchor="middle" font-size="10" fill="#7d6a1a">benign · bruteforce · ddos · dos · infiltration · portscan</text>

  <!-- Arrows: model manager → RF + XGB -->
  <line x1="305" y1="492" x2="215" y2="562" stroke="#8b949e" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="555" y1="492" x2="640" y2="562" stroke="#8b949e" stroke-width="1" marker-end="url(#arr)"/>

  <!-- ═══ ROW 4 — ML ARTIFACTS ══════════════════════════════════════ -->
  <rect x="60"  y="562" width="270" height="70" rx="8" fill="#1a1000" stroke="#d29922" stroke-width="1.2"/>
  <text x="195" y="585" text-anchor="middle" font-size="13" fill="#f0c040" font-weight="600">Random Forest</text>
  <text x="195" y="603" text-anchor="middle" font-size="10" fill="#c9a02a">rf_multiclass.pkl</text>
  <text x="195" y="619" text-anchor="middle" font-size="10" fill="#7d6a1a">100 trees · feature importance</text>

  <rect x="350" y="562" width="180" height="70" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="440" y="585" text-anchor="middle" font-size="12" fill="#c9d1d9" font-weight="600">StandardScaler</text>
  <text x="440" y="603" text-anchor="middle" font-size="10" fill="#8b949e">scaler.pkl</text>
  <text x="440" y="619" text-anchor="middle" font-size="10" fill="#484f58">label_encoder.pkl</text>

  <rect x="570" y="562" width="270" height="70" rx="8" fill="#1a1000" stroke="#d29922" stroke-width="1.2"/>
  <text x="705" y="585" text-anchor="middle" font-size="13" fill="#f0c040" font-weight="600">XGBoost</text>
  <text x="705" y="603" text-anchor="middle" font-size="10" fill="#c9a02a">xgb_multiclass.pkl</text>
  <text x="705" y="619" text-anchor="middle" font-size="10" fill="#7d6a1a">gradient boosting · fast inference</text>

  <!-- Arrows: RF + XGB → ensemble -->
  <line x1="220" y1="632" x2="310" y2="702" stroke="#8b949e" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="680" y1="632" x2="590" y2="702" stroke="#8b949e" stroke-width="1" marker-end="url(#arr)"/>

  <!-- ═══ ROW 5 — ENSEMBLE + BLOCKCHAIN ════════════════════════════ -->
  <!-- Ensemble box -->
  <rect x="80" y="702" width="540" height="70" rx="10" fill="#2d1a00" stroke="#f0883e" stroke-width="1.3"/>
  <text x="350" y="726" text-anchor="middle" font-size="13" fill="#ffa657" font-weight="700">Ensemble verdict + severity + recommended action</text>
  <text x="350" y="745" text-anchor="middle" font-size="10" fill="#c67a2e">Agreement → label · one benign → prefer threat · both differ → RF wins</text>
  <text x="350" y="762" text-anchor="middle" font-size="10" fill="#92400e">none · medium · high · critical</text>

  <!-- Dashed arrow: if threat → blockchain -->
  <line x1="590" y1="737" x2="672" y2="737" stroke="#3fb950" stroke-width="1.3" stroke-dasharray="5 3" marker-end="url(#arr-g)"/>
  <text x="635" y="726" text-anchor="middle" font-size="9" fill="#3fb950">if threat</text>

  <!-- Blockchain box -->
  <rect x="680" y="702" width="182" height="70" rx="10" fill="#0d2d1a" stroke="#238636" stroke-width="1.3"/>
  <text x="771" y="726" text-anchor="middle" font-size="12" fill="#3fb950" font-weight="700">Blockchain logger</text>
  <text x="771" y="744" text-anchor="middle" font-size="10" fill="#56d364">Ganache · ThreatLog.sol</text>
  <text x="771" y="760" text-anchor="middle" font-size="10" fill="#2ea043">logThreat() · immutable</text>

  <!-- Arrow: blockchain router → blockchain logger -->
  <line x1="764" y1="352" x2="771" y2="700" stroke="#238636" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arr-g)"/>

  <!-- JSON response arrow (back up left) -->
  <line x1="100" y1="702" x2="100" y2="292" stroke="#8b949e" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arr)"/>
  <text x="70" y="520" text-anchor="middle" font-size="9" fill="#484f58" transform="rotate(-90,70,520)">JSON response</text>

</svg>
