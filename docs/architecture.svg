<text class="cap" x="20" y="662"><tspan font-weight="bold">Fig. 1.</tspan> Architecture of ASTRA. Flows are scaled and classified by a Random Forest and an XGBoost model; the fused verdict is</text>
<text class="cap" x="20" y="685">explained with TreeSHAP and recorded in an audit log that is stored per record or anchored on an EVM chain as Merkle roots.</text>
