<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 50 1160 640" width="1160" height="640" font-family="'Times New Roman', Times, 'Liberation Serif', serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
    <style>
      .box   { fill:#f3f3f3; stroke:#222; stroke-width:1.3; }
      .chain { fill:#e4e4e4; stroke:#222; stroke-width:1.3; }
      .grp   { fill:none; stroke:#666; stroke-width:1.2; stroke-dasharray:6 4; }
      .ln    { fill:none; stroke:#222; stroke-width:1.3; marker-end:url(#a); }
      .lp    { fill:none; stroke:#222; stroke-width:1.3; }
      .ld    { fill:none; stroke:#222; stroke-width:1.2; stroke-dasharray:4 3; marker-end:url(#a); }
      .t     { font-size:15px; fill:#111; text-anchor:middle; }
      .s     { font-size:12.5px; fill:#333; text-anchor:middle; font-style:italic; }
      .g     { font-size:14px; fill:#444; font-style:italic; }
      .lb    { font-size:12.5px; fill:#222; font-style:italic; }
      .cap   { font-size:15px; fill:#111; }
    </style>
  </defs>
  <rect y="0" width="1160" height="700" fill="#fff"/>

  <!-- ── Detection pipeline ─────────────────────────────── -->
  <rect class="box" x="20"  y="130" width="150" height="80"/>
  <text class="t" x="95" y="162">Network flow</text>
  <text class="s" x="95" y="184">51 CICFlowMeter</text>
  <text class="s" x="95" y="200">features</text>

  <rect class="box" x="215" y="130" width="130" height="80"/>
  <text class="t" x="280" y="163">Preprocessing</text>
  <text class="s" x="280" y="187">RobustScaler</text>

  <rect class="grp" x="390" y="68" width="240" height="204"/>
  <text class="g" x="402" y="87">Ensemble classifier</text>
  <rect class="box" x="410" y="100" width="200" height="62"/>
  <text class="t" x="510" y="128">Random Forest</text>
  <text class="s" x="510" y="148">class + confidence</text>
  <rect class="box" x="410" y="188" width="200" height="62"/>
  <text class="t" x="510" y="216">XGBoost</text>
  <text class="s" x="510" y="236">class + confidence</text>

  <rect class="box" x="670" y="130" width="130" height="80"/>
  <text class="t" x="735" y="163">Ensemble</text>
  <text class="t" x="735" y="183">verdict</text>

  <rect class="box" x="840" y="130" width="130" height="80"/>
  <text class="t" x="905" y="163">Response</text>
  <text class="s" x="905" y="187">severity, action</text>

  <rect class="box" x="1010" y="130" width="130" height="80"/>
  <text class="t" x="1075" y="163">REST API /</text>
  <text class="t" x="1075" y="183">Dashboard</text>

  <path class="ln" d="M170,170 H215"/>
  <path class="lp" d="M345,170 H368"/>
  <path class="lp" d="M368,131 V219"/>
  <path class="ln" d="M368,131 H410"/>
  <path class="ln" d="M368,219 H410"/>
  <path class="ln" d="M610,131 H640 V156 H670"/>
  <path class="ln" d="M610,219 H640 V184 H670"/>
  <path class="ln" d="M800,170 H840"/>
  <path class="ln" d="M970,170 H1010"/>

  <!-- ── Explanation ───────────────────────────────────── -->
  <rect class="box" x="410" y="300" width="200" height="62"/>
  <text class="t" x="510" y="327">TreeSHAP explainer</text>
  <text class="s" x="510" y="347">XGBoost pred_contribs</text>

  <path class="ln" d="M510,250 V300"/>
  <path class="ln" d="M735,210 V331 H610"/>
  <text class="lb" x="726" y="285" text-anchor="end">verdict class</text>

  <!-- ── Audit module ──────────────────────────────────── -->
  <rect class="grp" x="20" y="400" width="1120" height="214"/>
  <text class="g" x="1128" y="420" text-anchor="end">Audit module</text>

  <rect class="box" x="40" y="455" width="190" height="76"/>
  <text class="t" x="135" y="482">Audit record</text>
  <text class="s" x="135" y="502">verdict, confidence,</text>
  <text class="s" x="135" y="518">explanation hash</text>

  <path class="ln" d="M410,331 H100 V455"/>
  <text class="lb" x="118" y="323">explanation + keccak256 hash</text>
  <path class="ln" d="M770,210 V385 H170 V455"/>
  <text class="lb" x="330" y="378">verdict, confidence, severity</text>

  <rect class="grp" x="630" y="425" width="220" height="160"/>
  <text class="g" x="642" y="443">Ethereum / EVM chain</text>
  <rect class="chain" x="650" y="455" width="180" height="48"/>
  <text class="t" x="740" y="475">ThreatLog</text>
  <text class="s" x="740" y="493">one transaction per record</text>
  <rect class="chain" x="650" y="523" width="180" height="48"/>
  <text class="t" x="740" y="543">MerkleAnchor</text>
  <text class="s" x="740" y="561">one root per batch</text>

  <rect class="box" x="340" y="505" width="200" height="66"/>
  <text class="t" x="440" y="531">Merkle batcher</text>
  <text class="s" x="440" y="551">off-chain tree + journal</text>

  <rect class="box" x="900" y="505" width="220" height="66"/>
  <text class="t" x="1010" y="531">Proof verification</text>
  <text class="s" x="1010" y="551">local and on-chain</text>

  <path class="ln" d="M230,479 H650"/>
  <text class="lb" x="262" y="472">LOGGING_MODE = per_record</text>
  <path class="ln" d="M230,516 H285 V538 H340"/>
  <text class="lb" x="240" y="510">merkle</text>
  <path class="ln" d="M540,547 H650"/>
  <text class="lb" x="556" y="541">root, count</text>
  <path class="ln" d="M830,547 H900"/>
  <text class="lb" x="848" y="541">root</text>
  <path class="ld" d="M440,571 V602 H1010 V571"/>
  <text class="lb" x="470" y="596">Merkle proof</text>

  <!-- ── Caption ───────────────────────────────────────── -->
  <text class="cap" x="20" y="652"><tspan font-weight="bold">Fig. 1.</tspan> Overall architecture of ASTRA. A flow is scaled and classified by a Random Forest and an XGBoost model; the</text>
  <text class="cap" x="20" y="672">fused verdict is explained with TreeSHAP and recorded in a tamper-evident audit log (per-record or Merkle-batched).</text>
</svg>
